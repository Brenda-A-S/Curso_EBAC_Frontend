<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./vue.js"></script>
    <title>Calculadora Vue</title>
    <style>
        body {
            background-color: #111;
            color: #eee;
            text-align: center;
        }
        div{
            padding-top: 100px;
        }
        input,select {
            display: inline-flex;
            border: none;
            border-radius: 50px;
            padding: 5px 10px;
            margin: 5px 0;
        }

    </style>
</head>

<body>
    <div id="app">
        <input type="number" v-model.number="n1">

        <select v-model="operacao">
            <option value="somar">+</option>
            <option value="subtrair">-</option>
            <option value="multiplicar">*</option>
            <option value="dividir">/</option>
        </select>

        <input type="number" v-model.number="n2">

        <p>O resultado é: {{ calcular }}</p>
    </div>

    <script>
        const vm = new Vue({
            el: "#app",
            data: {
                n1: 0,
                n2: 0,
                operacao: 'somar',
                resultado: 0
            },
            computed: {
                calcular() {
                    switch (this.operacao) {
                        case 'somar':
                            return this.resultado = this.n1 + this.n2;
                            break;
                        case 'subtrair':
                            return this.resultado = this.n1 - this.n2;
                            break;
                        case 'multiplicar':
                            return this.resultado = this.n1 * this.n2;
                            break;
                        case 'dividir':
                            return this.resultado = this.n2 !== 0 ? this.n1 / this.n2 : 'Erro: divisão por zero';
                            break;
                    }
                }
            }
        });
    </script>
</body>


</html>
